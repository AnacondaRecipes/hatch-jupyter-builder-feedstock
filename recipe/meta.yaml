{% set name = "hatch-jupyter-builder" %}
{% set version = "0.10.0" %}

# Note s390x supressed because of conflicts installing test packages, and some
package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/hatch_jupyter_builder-{{ version }}.tar.gz
  sha256: 144f6a7afd7f837071eca81141313d736643be4f6734b45f30661bcb922bd80a

build:
  script: {{ PYTHON }} -m pip install --no-deps --no-build-isolation . -vv
  number: 0
  skip: true  # [py<310]

requirements:
  host:
    - pip
    - python
    - hatchling >=1.17
    - jupyter_packaging
  run:
    - python
    - hatchling >=1.17
    - ipywidgets >=7.0.0

test:
  source_files:
    - .
  imports:
    - hatch_jupyter_builder
  commands:
    - pip check
    # Note windows tests supressed because of problems with utils.run(shlex.split(cmd))
    - python -m pytest -vv  # [not (win or s390x)]
  requires:
    - pip
    - pytest
    - pytest-mock
    - tomli

about:
  home: https://pypi.org/project/hatch-jupyter-builder/
  summary: A hatch plugin to help build Jupyter packages
  description: A build hook plugin for Hatch that adds a build step for use with Jupyter packages.
  dev_url: https://github.com/jupyterlab/hatch-jupyter-builder
  doc_url: https://hatch-jupyter-builder.readthedocs.io
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - blink1073
    - zsailer

<conda_recipe_manager.types.SentinelType object at 0x7f06902d6270>:  # breakage around ffi/cffi loading
  skip: true  # [py<38 or s390x]
